name: Auto AUR

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 每天0点执行
  # 由其它仓库的 workflow 通过 repository_dispatch 拉起，例如上游发布完
  # release 之后只更新对应的子包。payload 只用来「缩小范围」，不能凭空
  # 引入 conf.json 里没有的任务：
  #   {"client_payload": {"source": "owner/repo", "tasks": ["pkg-bin"],
  #                       "tag": "canary", "force": false}}
  repository_dispatch:
    types: [aur-release]
  workflow_dispatch:
    inputs:
      force_update:
        type: boolean
        description: "Disable skip feature(If no real updates, nothing will be pushed to AUR)"
        required: false
        default: false
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

jobs:
  # auto-aur writes .SRCINFO itself instead of having CI call makepkg. That is
  # only safe while its output matches what makepkg produces, and makepkg exists
  # on Arch alone, so the check needs an Arch container. It runs as a separate
  # job: publishing must not wait for it, and its failure must not leave a
  # half-updated AUR behind.
  srcinfo:
    name: .SRCINFO matches makepkg
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Go
        run: |
          pacman -Sy --noconfirm --needed go
          go version
      - uses: actions/checkout@v4

      # makepkg refuses to run as root, so the test runs as an unprivileged user.
      # AUTO_AUR_REQUIRE_MAKEPKG makes a missing tool a failure rather than a
      # skip, so this job cannot pass without actually comparing the two. It and
      # the Go binary path are set explicitly inside the su invocation, because su
      # resets the environment: inheriting them would silently revert the check
      # to a skip, and go lives outside the default PATH on Arch.
      - name: Verify .SRCINFO against makepkg
        run: |
          useradd -m runner
          chown -R runner:runner .
          gobin=$(command -v go)
          # HOME and GOCACHE are set explicitly: su keeps root's HOME, and Go
          # refuses to use a build cache it cannot own.
          su runner -c "cd '$GITHUB_WORKSPACE' && \
            HOME=/home/runner GOCACHE=/home/runner/.cache/go-build \
            AUTO_AUR_REQUIRE_MAKEPKG=1 '$gobin' test ./repo/your-szu-life/ -run TestSrcinfoMatchesMakepkg -v"

  build:
    name: Auto AUR
    runs-on: ubuntu-latest
    # One run per upstream at a time: two dispatches for the same repository
    # would race on the same AUR checkout and both try to push.
    concurrency:
      group: auto-aur-${{ github.event.client_payload.source || 'all' }}
      cancel-in-progress: false

    steps:
      # The dispatch payload is attacker-controlled input, so it is only ever
      # read through env vars (which the "run" script does not interpolate into
      # its own source) and only ever selects from conf.json's enabled tasks.
      - name: Resolve trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.event.client_payload.source }}
          TASKS: ${{ github.event.client_payload.tasks }}
          FORCE: ${{ github.event.client_payload.force }}
          FORCE_INPUT: ${{ inputs.force_update }}
        run: |
          # Emit the CLI flags that narrow this run. A malformed payload fails
          # this step alone, before any AUR checkout happens.
          flags=()
          case "$EVENT_NAME" in
            repository_dispatch)
              if [ -n "$SOURCE" ] || [ -n "$TASKS" ]; then
                flags+=(-from-event)
              fi
              [ "$FORCE" = "true" ] && flags+=(-force)
              ;;
            workflow_dispatch)
              [ "$FORCE_INPUT" = "true" ] && flags+=(-force)
              ;;
          esac
          printf 'flags=%s\n' "${flags[*]:-}" >> "$GITHUB_OUTPUT"
          printf 'auto-aur arguments: %s\n' "${flags[*]:-<none, run every task>}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Git User
        run: |
          git config --global user.name "rinne"
          git config --global user.email "Rinne@users.noreply.github.com"

      - name: Setup SSH Key for AUR
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_KEY }} # 用于AUR认证的SSH私钥
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          # 配置SSH连接到AUR
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
          EOF

          # 测试SSH连接（可选）
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          # ssh -T aur.archlinux.org

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true

      - name: Remove auto-aur.lock.json (force update)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update }}
        run: |
          rm -rf ./out/*/auto-aur.lock.json

      - name: Update PKGBUILD
        env:
          # Optional: raises the GitHub API rate limit. The workflow succeeds
          # without it, but unauthenticated quota is exhausted quickly.
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TRIGGER_FLAGS: ${{ steps.trigger.outputs.flags }}
        run: |
          go build -trimpath -o "$RUNNER_TEMP/auto-aur" .
          # TRIGGER_FLAGS comes from the previous step and holds only the flags
          # this workflow chose, never payload text. Word splitting is intended.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/auto-aur" run -v $TRIGGER_FLAGS
